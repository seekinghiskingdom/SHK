<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHK Color Palette</title>
<style>
  :root {
    /* 1) Neutral bases (backgrounds + panels) */
    --bg-light-page:        #aaaaa0;
    --bg-dark-page:         #505049;
    --bg-surface:     #d9d5cc;
    --bg-surface-alt: #c3beb3;
    --bg-dark:        #2b2622;
    --border-subtle:  #cfcac0;

    /* 2) Text */
    --text-light:     #f3f1eb;
    --text-dark:      #0f0d06;
    --text-muted:     #64645a;
    --text-on-gold:   #2b2520;

    /* 3) Brand golds */     /* Hue:=45-55; All spectrum: ...*/
    --brand-saint:       #c8af7a; /* c1b195, c8af7a */
    --brand-light:       #e0d1a6; /* me: fad976; chat: f3ebd2, f5eed6 */
    --brand-cross:       #e3c573; /*e7c35a, e5c467, e3c573 (e6c882 & debf77?); init dropper: c69d65, b68e54, d4bc90, debf77*/
    --brand-gold:        #e6c864; /* e6c864(easy rgb)=e5c467; chat: c1b195/e3c576, c8af7a/e7c35a */
    --brand-gold-trans-btn: rgba(230, 200, 100, 0.1);
    --brand-gold-trans-card: rgba(230, 200, 100, 0.3);

    --brand-pop:         #fadc00; /*C8A028/deb000/fac800/fadc00; can get to brand-gold in same hex hue/spectrum, it might be good to keep that for color theory (TBD)?*/
    --brand-strong:      #fac800; /*C8A028/deb000/fac800/fadc00; can get to brand-gold in same hex hue/spectrum, it might be good to keep that for color theory (TBD)?*/
    --brand-dark:        #c8a028; /*C8A028/deb000/fac800/fadc00; can get to brand-gold in same hex hue/spectrum, it might be good to keep that for color theory (TBD)?*/


    /* 4) Accents */
    --acc-link:          #7b8fc9; /* TBD */
    --acc-verse:         #c9d6f0; /* TBD */
    --acc-red-letters:   #880000;
    --acc-green:         #3c3c14;
    --acc-olive:         #645a28;
    --acc-earth:         #af8c37;
    --acc-tan:           #aa8246;
    --acc-brown:         #64461e;

    /* 5) State colors */
    --state-success: #4c8b5f;
    --state-warning: #e0a63b;
    --state-danger:  #c2543f;

    /* 6) Interaction */
    --focus-ring:   #7b8fc9; /* purpose? TBD */
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f2;
    color: #222;
    padding: 2rem;
  }

  h1 {
    margin-bottom: 1.5rem;
    font-size: 1.8rem;
  }

  .group {
    margin-bottom: 2rem;
  }

  .group-title {
    font-weight: 600;
    margin-bottom: 0.75rem;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.75;
  }

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .swatch {
    width: 190px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    background: #fff;
  }

  .swatch-color {
    height: 70px;
  }

  .swatch-body {
    padding: 0.55rem 0.75rem 0.7rem;
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .swatch-name {
    font-weight: 600;
    margin-bottom: 0.1rem;
  }

  .swatch-note {
    opacity: 0.8;
    margin-bottom: 0.2rem;
  }

  .swatch-hex,
  .swatch-rgb {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.74rem;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <h1>SHK Color Tokens</h1>
  <div id="palette"></div>

<script>
  // List-driven config: edit this only to add/remove tokens
const groups = [
  {
    title: "Neutrals / Backgrounds",
    items: [
      { var: "--bg-light-page",  note: "Default light-mode page background (body)" },
      { var: "--bg-dark-page",   note: "Default dark-mode page background (body)" },
      { var: "--bg-surface",     note: "Standard surface/card background on light page" },
      { var: "--bg-surface-alt", note: "Alternate surface/section background for stripes/contrast" },
      { var: "--bg-dark",        note: "Dark sections (footer, dark hero, overlays)" },
      { var: "--border-subtle",  note: "Hairline borders/dividers on light surfaces" },
    ]
  },
  {
    title: "Text",
    items: [
      { var: "--text-light",   note: "Primary text on dark backgrounds" },
      { var: "--text-dark",    note: "Primary text on light backgrounds (body, headings)" },
      { var: "--text-muted",   note: "Secondary/de-emphasized text (meta, hints, timestamps)" },
      { var: "--text-on-gold", note: "Text on gold buttons, badges, and gold callout backgrounds" },
    ]
  },
  {
    title: "Brand Golds",
    items: [
      { var: "--brand-saint",      note: "Midtone gold for decorative icons/illustrations (non-CTA)" },
      { var: "--brand-light",      note: "Soft gold background for callouts, strips, gentle halos" },
      { var: "--brand-cross",      note: "Primary brand gold for crosses/faith marks and small UI accents" },
      { var: "--brand-gold",       note: "Generic gold accent for borders, rules, and secondary buttons" }, 
      { var: "--brand-pop",        note: "High-impact highlight for small badges/pills, not full backgrounds" },
      { var: "--brand-strong",     note: "Primary CTA button background / key action emphasis" },
      { var: "--brand-dark",       note: "Hover/active shade for CTA gold or dark gold outlines" },
      { var: "--brand-trans-btn",  note: "Subtle gold-tinted background for secondary/ghost button hover" },
      { var: "--brand-trans-card", note: "Light gold overlay for highlighted cards/sections" },
    ]
  },
  {
    title: "Accents",
    items: [
      { var: "--acc-link",        note: "Default link color and focus outlines" },
      { var: "--acc-verse",       note: "Verse refs and gentle Scripture highlights" },
      { var: "--acc-red-letters", note: "Red-letter text (Words of Christ) in Scripture views" },
      { var: "--acc-green",       note: "Positive/creation-themed small icons or tags (sparingly)" },
      { var: "--acc-olive",       note: "Earthy accent for category tags/filters (sparingly)" },
      { var: "--acc-earth",       note: "Warm accent for testimony/story tags (sparingly)" },
      { var: "--acc-tan",         note: "Neutral tag backgrounds or small separators" },
      { var: "--acc-brown",       note: "Deep accent for icons/tiny borders; not main text" },
    ]
  },
  {
    title: "State / Feedback",
    items: [
      { var: "--state-success", note: "Success messages and positive status icons" },
      { var: "--state-warning", note: "Caution banners and non-destructive warnings" },
      { var: "--state-danger",  note: "Errors, validation failures, destructive actions" },
    ]
  }
];



  function rgbToHex(rgb) {
    const m = rgb.match(/\d+/g);
    if (!m) return "";
    return (
      "#" +
      m.slice(0, 3).map((n) => {
        const h = Number(n).toString(16).padStart(2, "0");
        return h;
      }).join("")
    );
  }

  const paletteEl = document.getElementById("palette");

  groups.forEach(group => {
    const groupEl = document.createElement("section");
    groupEl.className = "group";

    const titleEl = document.createElement("div");
    titleEl.className = "group-title";
    titleEl.textContent = group.title;
    groupEl.appendChild(titleEl);

    const swatchesEl = document.createElement("div");
    swatchesEl.className = "swatches";

    group.items.forEach(item => {
      const swatchEl = document.createElement("div");
      swatchEl.className = "swatch";

      const colorEl = document.createElement("div");
      colorEl.className = "swatch-color";
      colorEl.style.background = `var(${item.var})`;

      const bodyEl = document.createElement("div");
      bodyEl.className = "swatch-body";

      const nameEl = document.createElement("div");
      nameEl.className = "swatch-name";
      nameEl.textContent = item.var;

      const noteEl = document.createElement("div");
      noteEl.className = "swatch-note";
      noteEl.textContent = item.note || "";

      const hexEl = document.createElement("div");
      hexEl.className = "swatch-hex";

      const rgbEl = document.createElement("div");
      rgbEl.className = "swatch-rgb";

      bodyEl.appendChild(nameEl);
      bodyEl.appendChild(noteEl);
      bodyEl.appendChild(hexEl);
      bodyEl.appendChild(rgbEl);

      swatchEl.appendChild(colorEl);
      swatchEl.appendChild(bodyEl);
      swatchesEl.appendChild(swatchEl);

      // Once in DOM, read computed color to fill hex/rgb
      requestAnimationFrame(() => {
        const rgb = getComputedStyle(colorEl).backgroundColor; // e.g. "rgb(170, 170, 160)"
        const hex = rgbToHex(rgb);
        hexEl.textContent = hex;
        rgbEl.textContent = rgb;
      });
    });

    groupEl.appendChild(swatchesEl);
    paletteEl.appendChild(groupEl);
  });
</script>
</body>
</html>
