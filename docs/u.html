permalink: /u/

<section class="account-page account-bg-page mt-page" id="mt-page">

  <header class="mt-header">
    <div class="mt-header-main">

      <div class="mt-avatar" id="mt-avatar">
        <span id="mt-avatar-initial">✝</span>
      </div>

      <div>
        <p class="mt-display-name" id="mt-display-name"></p>
        <p class="mt-username" id="mt-username"></p>
      </div>

    </div>

    <div class="mt-actions">
      <button
        class="mt-settings-btn"
        type="button"
        id="mt-follow-btn"
      >
        Follow this testimony
      </button>

      <button
        class="mt-auth-btn"
        type="button"
        id="mt-my-testimony-btn"
      >
        See my testimony
      </button>
    </div>
  </header>

  <p id="mt-profile-status" class="mt-auth-note">
    Loading testimony…
  </p>

  <div class="mt-share-row">
    <button
      type="button"
      class="mt-settings-btn mt-share-btn"
      id="mt-share-btn"
      hidden
    >
      Share their testimony
    </button>
    <button
      type="button"
      class="mt-settings-btn mt-share-btn"
      id="mt-see-all-btn"
    >
      See all testimonies
    </button>
  </div>

  <hr class="mt-divider">

  <!-- Personal salvation testimony card (public view) -->
  <section class="mt-section">
    <h2 class="mt-section-title" id="mt-testimony-title">Testimony</h2>

    <div class="mt-salvation-card">
      <!-- No onboarding text/buttons here; just a container for their public salvation testimony -->
      <div id="mt-salvation-content"></div>
    </div>
  </section>

  <!-- Other testimonies filters (public view) -->
  <section class="mt-section">
    <div class="mt-section-header">
      <h2 class="mt-section-title">Other Testimonies</h2>
    </div>

    <div class="mt-tabs" role="tablist">
      <button class="mt-tab is-active" data-filter="all" type="button">All</button>
      <button class="mt-tab" data-filter="prayer" type="button">Prayers</button>
      <button class="mt-tab" data-filter="blessing" type="button">Blessings</button>
      <button class="mt-tab" data-filter="miracle" type="button">Miracles</button>
      <button class="mt-tab" data-filter="general" type="button">General</button>
      <!-- No "Private drafts" tab, no "+ Testimony" button -->
    </div>

    <!-- Empty container for that user's testimonies (no placeholder text for now) -->
    <div id="mt-testimonies-list" class="mt-list-placeholder"></div>
  </section>

</section>

<style>

<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';

  function getSupabaseClient() {
    if (!window.supabase || !window.supabase.createClient) return null;
    if (!window.shkSupabase) {
      window.shkSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }
    return window.shkSupabase;
  }

  const supabase = getSupabaseClient();

  function getHandleFromUrl() {
    // Preferred: ?handle=someone
    const params = new URLSearchParams(window.location.search);
    const fromQuery = params.get('handle');
    if (fromQuery) return fromQuery.toLowerCase();

    // Future-friendly: /u/someone/ style
    const segments = window.location.pathname.split('/').filter(Boolean);
    if (segments.length >= 2 && segments[0] === 'u') {
      return segments[1].toLowerCase();
    }

    return null;
  }

  function setupTabs() {
    const tabs = Array.from(document.querySelectorAll('.mt-tab'));
    if (!tabs.length) return;

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('is-active'));
        tab.classList.add('is-active');
        // Later we’ll filter testimonies by tab.dataset.filter
      });
    });
  }

  function renderProfile(profile) {
    const displayNameEl = document.getElementById('mt-display-name');
    const usernameEl = document.getElementById('mt-username');
    const avatarEl = document.getElementById('mt-avatar');
    const avatarInitialEl = document.getElementById('mt-avatar-initial');
    const statusEl = document.getElementById('mt-profile-status');
    const titleEl = document.getElementById('mt-testimony-title');
    const shareBtn = document.getElementById('mt-share-btn');
    const salvationContentEl = document.getElementById('mt-salvation-content');

    const handle = profile.handle;
    const displayName = profile.display_name || '';
    const avatarKey = profile.avatar_key || null;
    const salvationText = (profile.salvation_testimony || '').trim();
    const salvationVisibility = profile.salvation_visibility || 'private';

    const nameOrHandle = displayName || handle || 'Testimony';

    if (displayNameEl) displayNameEl.textContent = nameOrHandle;
    if (usernameEl) usernameEl.textContent = handle ? '@' + handle : '';

    if (titleEl) {
      const baseName = nameOrHandle;
      const possessive = baseName.endsWith('s')
        ? `${baseName}' testimony`
        : `${baseName}'s testimony`;
      titleEl.textContent = possessive;
    }

    if (statusEl) {
      if (salvationText && salvationVisibility === 'public') {
        statusEl.textContent = 'Public salvation testimony';
      } else {
        statusEl.textContent = 'This testimony is currently private. Please check back later to see if the user has updated the story of their salvation here!';
      }
    }

    if (salvationContentEl) {
      if (salvationText && salvationVisibility === 'public') {
        salvationContentEl.textContent = salvationText;
      } else {
        salvationContentEl.textContent =
          'This testimony is currently private. Please check back later to see if the user has updated the story of their salvation here!';
      }
    }

    // Fallback initial
    let initial = '✝';
    if (displayName && displayName.trim()) {
      initial = displayName.trim().charAt(0).toUpperCase();
    } else if (handle) {
      initial = handle.charAt(0).toUpperCase();
    }

    if (avatarEl && avatarInitialEl) {
      const url =
        avatarKey && window.SHK_getAvatarUrlByKey
          ? window.SHK_getAvatarUrlByKey(avatarKey)
          : null;

      if (url) {
        avatarEl.style.backgroundImage = "url('" + url + "')";
        avatarEl.classList.add('mt-avatar--has-image');
        avatarInitialEl.textContent = '';
      } else {
        avatarEl.style.backgroundImage = 'none';
        avatarEl.classList.remove('mt-avatar--has-image');
        avatarInitialEl.textContent = initial;
      }
    }

    // Share their testimony: copy current URL
    if (shareBtn) {
      const url = window.location.href;
      shareBtn.hidden = false;
      shareBtn.onclick = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
            const oldLabel = 'Share their testimony';
            shareBtn.textContent = 'Link copied!';
            setTimeout(() => {
              shareBtn.textContent = oldLabel;
            }, 2000);
          } else {
            window.prompt('Copy this link:', url);
          }
        } catch (err) {
          console.error('Clipboard error:', err);
          window.prompt('Copy this link:', url);
        }
      };
    }
  }

  function renderNotFound() {
    const statusEl = document.getElementById('mt-profile-status');
    const displayNameEl = document.getElementById('mt-display-name');
    const usernameEl = document.getElementById('mt-username');
    const titleEl = document.getElementById('mt-testimony-title');
    const salvationContentEl = document.getElementById('mt-salvation-content');

    if (displayNameEl) displayNameEl.textContent = 'User not found';
    if (usernameEl) usernameEl.textContent = '';
    if (titleEl) titleEl.textContent = 'Testimony';
    if (statusEl) {
      statusEl.textContent = 'We could not find a profile with that username.';
    }
    if (salvationContentEl) {
      salvationContentEl.textContent = '';
    }
  }

  async function initPublicProfile() {
    setupTabs();

    const statusEl = document.getElementById('mt-profile-status');
    const followBtn = document.getElementById('mt-follow-btn');
    const myBtn = document.getElementById('mt-my-testimony-btn');
    const seeAllBtn = document.getElementById('mt-see-all-btn');

    // Follow: for now, just send to sign-in (later can wire real follow logic)
    if (followBtn) {
      followBtn.onclick = () => {
        window.location.href = '/account/sign-in/';
      };
    }

    // See my testimony: always send to account page
    if (myBtn) {
      myBtn.onclick = () => {
        window.location.href = '/account/';
      };
    }

    if (seeAllBtn) {
      seeAllBtn.onclick = () => {
        window.location.href = '/testimony/wall/';
      };
    }

    const handle = getHandleFromUrl();

    if (!handle) {
      if (statusEl) {
        statusEl.textContent = 'No username provided in the link.';
      }
      return;
    }

    if (statusEl) {
      statusEl.textContent = 'Loading testimony for @' + handle + '…';
    }

    const { data, error } = await supabase
      .from('profiles')
      .select('id, handle, display_name, avatar_key, salvation_testimony, salvation_visibility')
      .eq('handle', handle)
      .maybeSingle();

    if (error) {
      console.error('Error loading profile:', error);
      if (statusEl) {
        statusEl.textContent = 'There was a problem loading this testimony.';
      }
      return;
    }

    if (!data) {
      renderNotFound();
      return;
    }

    renderProfile(data);
    // Later: load their other testimonies into #mt-testimonies-list
  }

  document.addEventListener('DOMContentLoaded', initPublicProfile);
</script>
