<header class="site-header">
  <div class="site-header-bar">
    <div class="site-header-inner">

      <!-- Left: logo + wordmark -->
      <a href="{{ '/' | relative_url }}" class="logo-link site-header-logo">
        <img
          src="{{ '/img/SHK-Cross.webp' | relative_url }}"
          alt="Seeking His Kingdom"
          class="rounded-img"
        />
        <span class="site-header-wordmark">
          <span class="site-header-wordmark-full">Seeking His Kingdom</span>
          <span class="site-header-wordmark-short">SHK</span>
        </span>
      </a>

      <!-- Center: primary tabs (desktop-first) -->
      <nav class="site-header-nav-primary" aria-label="Primary">
        <a href="{{ '/daily/'         | relative_url }}" class="site-header-nav-link">Daily</a>
        <a href="{{ '/bible/'         | relative_url }}" class="site-header-nav-link">Bible</a>
        <a href="{{ '/tools-games/'   | relative_url }}" class="site-header-nav-link">Tools &amp; Games</a>
        <a href="{{ '/literature/'    | relative_url }}" class="site-header-nav-link">Literature</a>
        <a href="{{ '/testimonies/'   | relative_url }}" class="site-header-nav-link">Testimonies</a>
        <a href="{{ '/about/'         | relative_url }}" class="site-header-nav-link">About</a>
      </nav>

      <!-- Right: search, account, hamburger -->
      <div class="site-header-utilities">
        <button class="site-header-icon-btn site-header-search-btn" type="button" aria-label="Search">
          <span class="site-header-icon">🔍</span>
        </button>

        <a href="{{ '/account/' | relative_url }}" class="site-header-account-pill">
          <span class="site-header-account-avatar">
            <span id="site-account-initial" class="site-account-initial">✝</span>
            <img
              id="site-account-avatar-img"
              class="site-account-avatar-img"
              src=""
              alt="Your profile picture"
              style="display:none;"
            />
          </span>
          <span class="site-header-account-label">Account</span>
        </a>

        <button
          class="site-header-icon-btn site-header-menu-toggle"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          data-nav-toggle
        >
          <span class="site-header-icon">☰</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Overlay + slide-out nav (desktop + mobile) -->
  <div class="site-nav-overlay" data-nav-overlay hidden>
    <div
      class="site-nav-drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Site navigation"
    >
      <button
        class="site-nav-close"
        type="button"
        aria-label="Close navigation"
        data-nav-close
      >
        ×
      </button>

      <div class="site-nav-drawer-section">
        <h2 class="site-nav-drawer-title">Navigate</h2>
        <ul class="site-nav-drawer-list">
          <li><a href="{{ '/daily/'       | relative_url }}">Daily Overview</a></li>
          <li><a href="{{ '/bible/'       | relative_url }}">Bible Tools</a></li>
          <li><a href="{{ '/tools-games/' | relative_url }}">Tools &amp; Games</a></li>
          <li><a href="{{ '/literature/'  | relative_url }}">Literature &amp; Articles</a></li>
          <li><a href="{{ '/testimonies/' | relative_url }}">Testimonies</a></li>
          <li><a href="{{ '/community/'   | relative_url }}">Community</a></li>
          <li><a href="{{ '/about/'       | relative_url }}">About SHK</a></li>
        </ul>
      </div>

      <div class="site-nav-drawer-section">
        <h2 class="site-nav-drawer-title">Your account</h2>
        <ul class="site-nav-drawer-list">
          <li><a href="{{ '/account/' | relative_url }}">Account home</a></li>
          <li><a href="{{ '/account/testimony/' | relative_url }}">My testimony</a></li>
        </ul>
      </div>
    </div>
  </div>



<script>
  (function () {
    function initNav() {
      var toggle  = document.querySelector('[data-nav-toggle]');
      var overlay = document.querySelector('[data-nav-overlay]');
      if (!toggle || !overlay) return;

      var closeBtn = overlay.querySelector('[data-nav-close]');

      function openNav() {
        overlay.hidden = false;
        toggle.setAttribute('aria-expanded', 'true');
        document.body.classList.add('site-nav-open');
      }

      function closeNav() {
        overlay.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('site-nav-open');
      }

      toggle.addEventListener('click', function () {
        if (overlay.hidden) {
          openNav();
        } else {
          closeNav();
        }
      });

      if (closeBtn) {
        closeBtn.addEventListener('click', closeNav);
      }

      // Click on dim background closes drawer
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
          closeNav();
        }
      });

      // Esc key closes drawer
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.hidden) {
          closeNav();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initNav);
    } else {
      initNav();
    }
  })();
</script>



</header>
<hr>
