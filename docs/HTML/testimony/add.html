---
layout: default
title: Add Testimony
permalink: /testimony/add/
---

<section class="account-page account-bg-page mt-page">
  <header class="mt-header">
    <h1 class="mt-title">Add a testimony</h1>
    <p class="mt-subtitle">
      Share a prayer request, blessing, miracle, or general testimony.
    </p>
  </header>

  <div class="mt-add-testimony-card">
    <p id="mt-add-auth-note" class="mt-auth-note">
      Checking your account…
    </p>

    <form id="mt-add-form" class="mt-add-form" hidden>
      <label>
        Type
        <select id="mt-kind" required>
          <option value="">Select one…</option>
          <option value="PRAYER">Prayer request</option>
          <option value="BLESSING">Blessing / praise</option>
          <option value="MIRACLE">Miracle</option>
          <option value="GENERAL">General testimony</option>
        </select>
      </label>

      <label>
        Title
        <input
          type="text"
          id="mt-title"
          required
          maxlength="160"
          placeholder="Short title (e.g., “God’s provision for rent”)"
        >
      </label>

      <label>
        Testimony
        <textarea
          id="mt-body"
          rows="8"
          required
          placeholder="Describe what happened, how you prayed, what God did, and how it has affected you or others."
        ></textarea>
      </label>

      <label>
        Visibility
        <select id="mt-visibility" required>
          <option value="PUBLIC_NAMED">Public with my name</option>
          <option value="PUBLIC_ANONYMOUS">Public but anonymous</option>
          <option value="PRIVATE">Private (only I can see it)</option>
        </select>
      </label>

      <button type="submit" class="mt-pill-button">
        Save testimony
      </button>
      <button
        type="button"
        class="mt-pill-button mt-pill-outline"
        id="mt-add-cancel"
      >
        Cancel
      </button>

      <p id="mt-add-message" class="account-message"></p>
    </form>
  </div>
</section>

<style>
.mt-add-testimony-card {
  margin-top: 1rem;
  background: rgba(222, 176, 0, 0.3);
  border-radius: 16px;
  padding: 1.1rem 1.2rem 1rem;
  border: 1px solid rgba(249, 250, 251, 0.18);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
}

.mt-add-form {
  margin-top: 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.mt-add-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.95rem;
}

.mt-add-form input,
.mt-add-form select,
.mt-add-form textarea {
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid var(--text-light);
  background: rgba(17, 24, 39, 0.9);
  color: var(--text-light);
  font: inherit;
}

.mt-add-form input::placeholder,
.mt-add-form textarea::placeholder {
  color: #6b7280;
}

.mt-add-form input:focus,
.mt-add-form select:focus,
.mt-add-form textarea:focus {
  outline: none;
  border-color: var(--brand-gold);
  box-shadow: 0 0 0 1px rgba(222, 176, 0, 0.55);
}
</style>

<!-- <script src="https://unpkg.com/@supabase/supabase-js@2"></script> -->
<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';
  function getSupabaseClient() {
    if (!window.supabase || !window.supabase.createClient) return null;
    if (!window.shkSupabase) {
        window.shkSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }
    return window.shkSupabase;
  }

  const supabase = getSupabaseClient();

  async function initAddTestimony() {
    const authNote = document.getElementById('mt-add-auth-note');
    const form = document.getElementById('mt-add-form');
    const kindInput = document.getElementById('mt-kind');
    const titleInput = document.getElementById('mt-title');
    const bodyInput = document.getElementById('mt-body');
    const visibilityInput = document.getElementById('mt-visibility');
    const msgEl = document.getElementById('mt-add-message');
    const cancelBtn = document.getElementById('mt-add-cancel');

    // 1) Require sign-in
    const { data, error } = await supabase.auth.getUser();
    if (error || !data || !data.user) {
      if (authNote) {
        authNote.textContent =
          'You need to sign in to add a testimony. Redirecting to the sign-in page…';
      }
      setTimeout(() => {
        window.location.href = '/account/sign-in/';
      }, 1500);
      return;
    }

    const user = data.user;
    if (authNote) authNote.textContent = 'Signed in as ' + (user.email || 'your SHK account');
    if (form) form.hidden = false;

    // 2) Submit handler → insert into testimony_items
    if (form) {
      form.addEventListener('submit', async (evt) => {
        evt.preventDefault();
        if (!kindInput || !titleInput || !bodyInput || !visibilityInput || !msgEl) return;

        const kind = kindInput.value;
        const title = titleInput.value.trim();
        const body = bodyInput.value.trim();
        const visibility = visibilityInput.value;

        msgEl.textContent = '';
        msgEl.className = 'account-message';

        if (!kind || !title || !body || !visibility) {
          msgEl.textContent = 'Please fill out all required fields.';
          msgEl.classList.add('error');
          return;
        }

        msgEl.textContent = 'Saving your testimony…';

        try {
          const { error: insertError } = await supabase
            .from('testimony_items')
            .insert({
              owner_user_id: user.id,
              kind,
              title,
              body,
              visibility
            });

          if (insertError) {
            console.error('Insert testimony error:', insertError);
            msgEl.textContent = insertError.message || 'Unable to save testimony.';
            msgEl.classList.add('error');
            return;
          }

          msgEl.textContent = 'Testimony saved.';
          msgEl.classList.add('success');
          form.reset();
        } catch (e) {
          console.error('Network / insert error:', e);
          msgEl.textContent = 'Network error while saving. Please try again.';
          msgEl.classList.add('error');
        }
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        window.location.href = '/account/';
      });
    }
  }

  document.addEventListener('DOMContentLoaded', initAddTestimony);
</script>
