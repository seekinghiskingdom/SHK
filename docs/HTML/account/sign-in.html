title: Sign in to SHK
permalink: /account/sign-in/

<!-- Layout and copy assisted by AI (-AI) -->
<section class="auth-page account-bg-page">
  <div class="auth-shell">

    <div class="auth-card">
      <h1 class="auth-title">Sign in to Seeking His Kingdom</h1>
      <p class="auth-subtitle">
        Access your personal testimony hub and start sharing what God is doing in your life.
      </p>

      <form id="shk-signin-form" class="auth-form">
        <label>
          Email
          <input id="signin-email" type="email" name="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <input id="signin-password" type="password" name="password" autocomplete="current-password" required>
        </label>

        <button type="submit" class="auth-btn-main">Sign in</button>

        <p id="signin-message" class="auth-message"></p>
      </form>

      <div class="auth-links">
        <p>
          Don’t have an account?
          <a href="/account/sign-up/">Create one</a>
        </p>
        <p>
          Forgot your password?
          <button type="button" id="send-reset-link" class="link-button">
            Send reset link
          </button>
        </p>
      </div>
    </div>

  </div>
</section>

<style>
.auth-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}

/* Center the card on the screen */
.auth-shell {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh;
}

/* Translucent gold card */
.auth-card {
  width: 100%;
  max-width: 420px;
  background: rgba(222, 176, 0, 0.6); /* ~60% opacity gold */
  border-radius: 16px;
  border: 1px solid #d09f00;
  padding: 1.5rem 1.5rem 1.75rem;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
  color: #111827;
  backdrop-filter: blur(6px);
}

.auth-title {
  margin: 0 0 0.5rem;
  font-size: 1.4rem;
}

.auth-subtitle {
  margin: 0 0 1.25rem;
  font-size: 0.95rem;
  color: #1f2933;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.auth-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.95rem;
}

.auth-form input[type="email"],
.auth-form input[type="password"] {
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid #9ca3af;
  font: inherit;
  background: #f9fafb;
  color: #111827;
}

.auth-form input::placeholder {
  color: #6b7280;
}

.auth-form input:focus {
  outline: none;
  border-color: #b08900;
  box-shadow: 0 0 0 1px rgba(176, 137, 0, 0.5);
}

.auth-btn-main {
  align-self: flex-start;
  margin-top: 0.4rem;
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  border: 1px solid #b08900;
  background: #f3c43a;
  color: #111827;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.auth-message {
  font-size: 0.85rem;
  margin-top: 0.4rem;
  min-height: 1.1em;
  color: #111827;
}

.auth-message.error {
  color: #991b1b;
}

.auth-message.success {
  color: #166534;
}

.auth-links {
  margin-top: 1rem;
  font-size: 0.9rem;
  color: #111827;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.auth-links a {
  color: #7a5700;
  text-decoration: underline;
}

.link-button {
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  color: #7a5700;
  text-decoration: underline;
  font: inherit;
  cursor: pointer;
}

@media (max-width: 640px) {
  .auth-page {
    padding-inline: 1rem;
  }

  .auth-shell {
    min-height: 60vh;
  }
}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const form = document.getElementById('shk-signin-form');
  const emailInput = document.getElementById('signin-email');
  const passwordInput = document.getElementById('signin-password');
  const messageEl = document.getElementById('signin-message');
  const resetBtn = document.getElementById('send-reset-link');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    messageEl.textContent = '';
    messageEl.className = 'auth-message';

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      messageEl.textContent = 'Please enter your email and password.';
      messageEl.classList.add('error');
      return;
    }

    messageEl.textContent = 'Signing you in...';

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('Supabase signIn error:', error);
        messageEl.textContent = error.message || 'Unable to sign in. Please check your details.';
        messageEl.classList.add('error');
        return;
      }

      window.location.href = '/account/';
    } catch (e) {
      console.error('Network / fetch error:', e);
      messageEl.textContent = 'Network error while contacting the server. Please try again.';
      messageEl.classList.add('error');
    }
  });

  if (resetBtn) {
    resetBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      messageEl.textContent = '';
      messageEl.className = 'auth-message';

      if (!email) {
        messageEl.textContent = 'Enter your email above, then click “Send reset link.”';
        messageEl.classList.add('error');
        return;
      }

      messageEl.textContent = 'Sending reset link...';

      try {
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://seekinghiskingdom.org/account/reset-password/'
        });

        if (error) {
          console.error('resetPasswordForEmail error:', error);
          messageEl.textContent = error.message || 'Unable to send reset link.';
          messageEl.classList.add('error');
          return;
        }

        messageEl.textContent = 'Check your email for a link to reset your password.';
        messageEl.classList.add('success');
      } catch (e) {
        console.error('Network error sending reset link:', e);
        messageEl.textContent = 'Network error while sending reset link. Please try again.';
        messageEl.classList.add('error');
      }
    });
  }
</script>
