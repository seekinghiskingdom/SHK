---
layout: default
title: Create your SHK account
permalink: /account/sign-up/
---

<!-- Layout and copy assisted by AI (-AI) -->
<section class="auth-page account-bg-page">
  <div class="auth-shell">

    <div class="auth-card">
      <h1 class="auth-title">Create your SHK account</h1>
      <p class="auth-subtitle">
        Set up your personal space to write, remember, and share what God is doing in your life.
      </p>

      <form id="shk-signup-form" class="auth-form">
        <label>
          Display name (optional)
          <span
            class="field-help-inline"
            title="This is the name others may see on your testimonies. 2–40 characters; no emails, links, or offensive content."
          >?</span>
          <input
            id="signup-display-name"
            type="text"
            name="display_name"
            autocomplete="name"
            maxlength="80"
          >
          <p class="field-help">
            This is the name that may appear on your testimonies (first name or nickname).
          </p>
        </label>

        <label>
          Email
          <input id="signup-email" type="email" name="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <span
            class="field-help-inline"
            title="Use at least 8 characters. Avoid reusing passwords from other sites."
          >?</span>
          <input
            id="signup-password"
            type="password"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
          >
          <p class="field-help">
            At least 8 characters. Using a unique password helps keep your account secure.
          </p>
        </label>

        <button type="submit" class="auth-btn-main">Create account</button>

        <p id="signup-message" class="auth-message"></p>
      </form>

      <div class="auth-links">
        <p>
          Already have an account?
          <a href="/account/sign-in/">Sign in</a>
        </p>
      </div>
    </div>

  </div>
</section>

<style>
.auth-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}

/* Center the card on the screen */
.auth-shell {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh;
}

/* Translucent gold card */
.auth-card {
  width: 100%;
  max-width: 420px;
  background: rgba(222, 176, 0, 0.3); /* ~60% opacity gold */
  border-radius: 16px;
  border: 1px solid #d09f00;
  padding: 1.5rem 1.5rem 1.75rem;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
  color: #111827;
  backdrop-filter: blur(3px);
}

.auth-title {
  margin: 0 0 0.5rem;
  font-size: 1.4rem;
}

.auth-subtitle {
  margin: 0 0 1.25rem;
  font-size: 0.95rem;
  color: #1f2933;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.auth-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.95rem;
}

.auth-form input[type="email"],
.auth-form input[type="password"],
.auth-form input[type="text"] {
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid #9ca3af;
  font: inherit;
  background: #f9fafb;
  color: #111827;
}

.auth-form input::placeholder {
  color: #6b7280;
}

.auth-form input:focus {
  outline: none;
  border-color: #b08900;
  box-shadow: 0 0 0 1px rgba(176, 137, 0, 0.5);
}

.auth-btn-main {
  align-self: flex-start;
  margin-top: 0.4rem;
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  border: 1px solid #b08900;
  background: #f3c43a;
  color: #111827;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.auth-message {
  font-size: 0.85rem;
  margin-top: 0.4rem;
  min-height: 1.1em;
  color: #111827;
}

.auth-message.error {
  color: #991b1b;
}

.auth-message.success {
  color: #166534;
}

.auth-links {
  margin-top: 1rem;
  font-size: 0.9rem;
  color: #111827;
}

.auth-links a {
  color: #7a5700;
  text-decoration: underline;
}

/* Small inline ? bubble + helper text */
.field-help-inline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.1rem;
  height: 1.1rem;
  margin-left: 0.35rem;
  border-radius: 999px;
  border: 1px solid #b08900;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: help;
}

.field-help {
  margin: 0.15rem 0 0;
  font-size: 0.8rem;
  color: #1f2933;
}

@media (max-width: 640px) {
  .auth-page {
    padding-inline: 1rem;
  }

  .auth-shell {
    min-height: 60vh;
  }
}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const form = document.getElementById('shk-signup-form');
  const displayNameInput = document.getElementById('signup-display-name');
  const emailInput = document.getElementById('signup-email');
  const passwordInput = document.getElementById('signup-password');
  const messageEl = document.getElementById('signup-message');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    messageEl.textContent = '';
    messageEl.className = 'auth-message';

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      messageEl.textContent = 'Please enter an email and password.';
      messageEl.classList.add('error');
      return;
    }

    messageEl.textContent = 'Creating your account...';
    const displayName = displayNameInput.value.trim();

    try {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: 'https://seekinghiskingdom.org/account/confirm/',
          data: {
            display_name: displayName || null
          }
        }
      });

      console.log('Supabase signUp result:', { data, error });

      if (error) {
        console.error('Supabase signUp error:', error);
        messageEl.textContent = error.message || 'Something went wrong. Please try again.';
        messageEl.classList.add('error');
        return;
      }

      // Extra guard
      if (!data || !data.user) {
        console.warn('Sign-up returned no user object:', data);
        messageEl.textContent =
          'We couldn’t complete sign-up. Please try again in a few minutes.';
        messageEl.classList.add('error');
        return;
      }

      messageEl.textContent =
        'Account created! Please check your email and click the confirmation link before signing in.';
      messageEl.classList.add('success');
      form.reset();

    } catch (e) {
      console.error('Network / fetch error:', e);
      messageEl.textContent = 'Network error while contacting the server. Please try again.';
      messageEl.classList.add('error');
    }
  });
</script>
