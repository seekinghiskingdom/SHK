<!-- Layout and copy assisted by AI (-AI) -->
<section class="auth-page account-bg-page">
  <div class="auth-shell">

    <div class="auth-card">
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-subtitle">
        This link lets you securely set a new password for your SHK account.
      </p>

      <p id="reset-invalid" class="auth-message error" style="display:none;">
        This reset link is invalid or has expired.
        <a href="/account/sign-in/" style="color:#7a5700; text-decoration:underline;">Request a new password reset</a>.
      </p>

      <div id="reset-content" style="display:none;">
        <form id="reset-form" class="auth-form">
          <label>
            New password
            <input type="password" id="reset-new-password" required minlength="8" autocomplete="new-password">
          </label>
          <label>
            Confirm new password
            <input type="password" id="reset-confirm-password" required minlength="8" autocomplete="new-password">
          </label>
          <button type="submit" class="auth-btn-main">Update password</button>
          <p id="reset-message" class="auth-message"></p>
        </form>
      </div>
    </div>

  </div>
</section>

<style>
.auth-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}

.auth-shell {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh;
}

/* Translucent gold card */
.auth-card {
  width: 100%;
  max-width: 420px;
  background: rgba(222, 176, 0, 0.6);
  border-radius: 16px;
  border: 1px solid #d09f00;
  padding: 1.5rem 1.5rem 1.75rem;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
  color: #111827;
  backdrop-filter: blur(6px);
}

.auth-title {
  margin: 0 0 0.5rem;
  font-size: 1.4rem;
}

.auth-subtitle {
  margin: 0 0 1.25rem;
  font-size: 0.95rem;
  color: #1f2933;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.auth-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.95rem;
}

.auth-form input[type="password"] {
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid #9ca3af;
  font: inherit;
  background: #f9fafb;
  color: #111827;
}

.auth-form input:focus {
  outline: none;
  border-color: #b08900;
  box-shadow: 0 0 0 1px rgba(176, 137, 0, 0.5);
}

.auth-btn-main {
  align-self: flex-start;
  margin-top: 0.4rem;
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  border: 1px solid #b08900;
  background: #f3c43a;
  color: #111827;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.auth-message {
  font-size: 0.85rem;
  margin-top: 0.4rem;
  min-height: 1.1em;
  color: #111827;
}

.auth-message.error {
  color: #991b1b;
}

.auth-message.success {
  color: #166534;
}

@media (max-width: 640px) {
  .auth-page {
    padding-inline: 1rem;
  }

  .auth-shell {
    min-height: 60vh;
  }
}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  async function initResetPage() {
    const invalidEl = document.getElementById('reset-invalid');
    const contentEl = document.getElementById('reset-content');

    const { data, error } = await supabase.auth.getUser();

    if (error || !data || !data.user) {
      invalidEl.style.display = 'block';
      contentEl.style.display = 'none';
      return;
    }

    invalidEl.style.display = 'none';
    contentEl.style.display = 'block';

    const form = document.getElementById('reset-form');
    const pw1Input = document.getElementById('reset-new-password');
    const pw2Input = document.getElementById('reset-confirm-password');
    const msgEl = document.getElementById('reset-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = '';
      msgEl.className = 'auth-message';

      const pw1 = pw1Input.value;
      const pw2 = pw2Input.value;

      if (!pw1 || !pw2) {
        msgEl.textContent = 'Please fill in both password fields.';
        msgEl.classList.add('error');
        return;
      }

      if (pw1 !== pw2) {
        msgEl.textContent = 'Passwords do not match.';
        msgEl.classList.add('error');
        return;
      }

      msgEl.textContent = 'Updating password...';

      const { data, error } = await supabase.auth.updateUser({ password: pw1 });

      if (error) {
        console.error(error);
        msgEl.textContent = error.message || 'Unable to update password.';
        msgEl.classList.add('error');
        return;
      }

      msgEl.textContent = 'Password updated successfully. You can now sign in with your new password.';
      msgEl.classList.add('success');
      form.reset();
    });
  }

  document.addEventListener('DOMContentLoaded', initResetPage);
</script>
