---
layout: default
title: Reset your password
permalink: /account/reset-password/
---

<section class="account-page reset-page">
  <h1>Reset your password</h1>

  <p id="reset-invalid" style="display:none;">
    This reset link is invalid or has expired. Please
    <a href="/account/sign-in/">request a new password reset</a>.
  </p>

  <div id="reset-content" style="display:none;">
    <p class="reset-note">
      Choose a new password for your Seeking His Kingdom account.
    </p>

    <form id="reset-form" class="account-form">
      <label>
        New password
        <input type="password" id="reset-new-password" required minlength="8" autocomplete="new-password">
      </label>
      <label>
        Confirm new password
        <input type="password" id="reset-confirm-password" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit">Update password</button>
      <p id="reset-message" class="account-message"></p>
    </form>
  </div>
</section>

<style>
.reset-page {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.reset-note {
  font-size: 0.9rem;
  color: #fafafa;
  margin-bottom: 0.75rem;
}

/* Reuse same basic styles as other account pages if not global */

.account-form {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: 420px;
}

.account-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.95rem;
}

.account-form input[type="password"] {
  padding: 0.4rem 0.5rem;
  border-radius: 4px;
  border: 1px solid #ccc;
  font: inherit;
}

.account-form button {
  align-self: flex-start;
  margin-top: 0.25rem;
  padding: 0.4rem 0.9rem;
  border-radius: 999px;
  border: 1px solid #d09f00;
  background: #e2b200;
  color: #222;
  font-size: 0.95rem;
  cursor: pointer;
}

.account-message {
  font-size: 0.85rem;
  margin-top: 0.25rem;
  min-height: 1.1em;
}

.account-message.error {
  color: #b91c1c;
}

.account-message.success {
  color: #166534;
}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://vubmekxghtydatmofsit.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7BqkY9_i_wMhcupuThXibw_SHoGJox9';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  async function initResetPage() {
    const invalidEl = document.getElementById('reset-invalid');
    const contentEl = document.getElementById('reset-content');

    // User should have a special "recovery" session if they came from the email link
    const { data, error } = await supabase.auth.getUser();

    if (error || !data || !data.user) {
      invalidEl.style.display = 'block';
      contentEl.style.display = 'none';
      return;
    }

    // Valid recovery session: show form
    invalidEl.style.display = 'none';
    contentEl.style.display = 'block';

    const form = document.getElementById('reset-form');
    const pw1Input = document.getElementById('reset-new-password');
    const pw2Input = document.getElementById('reset-confirm-password');
    const msgEl = document.getElementById('reset-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = '';
      msgEl.className = 'account-message';

      const pw1 = pw1Input.value;
      const pw2 = pw2Input.value;

      if (!pw1 || !pw2) {
        msgEl.textContent = 'Please fill in both password fields.';
        msgEl.classList.add('error');
        return;
      }

      if (pw1 !== pw2) {
        msgEl.textContent = 'Passwords do not match.';
        msgEl.classList.add('error');
        return;
      }

      msgEl.textContent = 'Updating password...';

      const { data, error } = await supabase.auth.updateUser({ password: pw1 });

      if (error) {
        console.error(error);
        msgEl.textContent = error.message || 'Unable to update password.';
        msgEl.classList.add('error');
        return;
      }

      msgEl.textContent = 'Password updated successfully. You can now sign in with your new password.';
      msgEl.classList.add('success');
      form.reset();
    });
  }

  document.addEventListener('DOMContentLoaded', initResetPage);
</script>
